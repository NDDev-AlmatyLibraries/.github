# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@125398887d3f3ac839ff89582482a4dc61acb766 # v0.6.174
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      retain-separate-merge-stops: true
