# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@9f400b71c978c8c3974863f4dd25331d3d1be79d # v0.6.176
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      retain-separate-merge-stops: true
