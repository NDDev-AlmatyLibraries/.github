# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@2026f7caa214a80d728d77bbc69787b4370051fb # v0.6.179
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      retain-separate-merge-stops: true
