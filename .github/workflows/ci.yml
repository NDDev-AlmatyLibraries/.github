# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@969b1ca89612dfb457792228c0120204c5498a41 # v0.6.165
    permissions:
      contents: read
    with:
      public-self-hosted-runner: nddev-linux-light-public
      retain-separate-merge-stops: true
