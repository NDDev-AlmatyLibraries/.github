# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@c92818085dff62e5e3aded10dc90efc13d85d3de # v0.6.167
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      retain-separate-merge-stops: true
