# Pull requests run the short check and a push to dev the full check; promotion then moves main to
# the checked dev commit.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@65901e0f87cb8bc931c2f92ff60c319859aec60b # v0.6.164
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      inline-merge-stops: false
