# Moves main forward to the newest dev commit whose full check passed.
name: promotion

on:
  # The pinned library selects checked dev pushes and executes no triggering source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    branches: [dev]
    types: [completed]
  workflow_dispatch: {}

permissions: {}

jobs:
  promote:
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/promote.yml@969b1ca89612dfb457792228c0120204c5498a41 # v0.6.165
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: write
      contents: read
    with:
      public-self-hosted-runner: nddev-linux-light-public
