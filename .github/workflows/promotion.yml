# Moves main forward to the newest dev commit whose full check passed.
name: promotion

on:
  # The pinned library selects checked dev pushes and executes no triggering source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    branches: [dev]
    types: [completed]
  workflow_dispatch: {}

permissions: {}

jobs:
  promote:
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/promote.yml@276ebc72582644040950ff13629469e16370d432 # v0.6.169
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: write
      contents: read
    with:
      hosted-runner: ubuntu-26.04
